[project]
name = "bashagent"
version = "0.1.0"
description = "Translate a plain-language request into a bash command, an explanation, and a risk label. Never executes the command."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rebecka Vannerberg", email = "familjenskung@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
bashagent = "bashagent.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bashagent"
module-root = ""

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["bashagent", "eval", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
