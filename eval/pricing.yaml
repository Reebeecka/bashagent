# USD per 1M tokens. Standard rates from the OpenAI pricing page.
# https://developers.openai.com/api/docs/pricing
# Cached input is cheaper. This table bills every input token at the
# uncached rate, which keeps the run cap on the high side of the real bill.
date: 2026-10-19
currency: USD
models:
  gpt-4.1-mini:
    input_per_million: 0.40
    output_per_million: 1.60
  gpt-4.1:
    input_per_million: 2.00
    output_per_million: 8.00
