# Example tasks that fix the file format. This is not the 40-task set.
# The reference commands are hand-written illustrations (authoring_model: none).
# They have not been execution-validated. Do not treat a run against them as a
# measurement. Ground truth for the real set is written with a model that is
# not under evaluation, then validated in the fixture before the first measurement.
version: 0
authoring_model: none
tasks:
  - id: find-large-pdfs
    prompt_sv: "hitta alla pdf:er större än 10 MB under aktuell katalog"
    category: filsökning
    difficulty: enkel
    method: behavior
    compare: stdout
    risk_label: safe
    smoke: true
    reference:
      default: "find . -type f -name '*.pdf' -size +10M"
    accepted_variants:
      - "find . -name '*.pdf' -size +10M -type f"
    fixture: standard
    notes: "BSD and GNU agree here. Example only; not execution-validated."

  - id: count-404
    prompt_sv: "räkna hur många rader i access.log som innehåller 404"
    category: textbearbetning
    difficulty: enkel
    method: behavior
    compare: stdout
    risk_label: safe
    smoke: true
    reference:
      default: "grep -c 404 access.log"
    accepted_variants:
      - "grep -c '404' access.log"
    fixture: standard
    notes: "Example only; not execution-validated."

  - id: make-scripts-executable
    prompt_sv: "gör alla .sh-filer i projektet körbara"
    category: behörigheter
    difficulty: sammansatt
    method: behavior
    compare: fsstate
    risk_label: caution
    smoke: true
    reference:
      default: "find . -type f -name '*.sh' -exec chmod +x {} +"
    fixture: standard
    notes: "Filesystem comparison is not run in this skeleton."

  - id: sed-in-place
    prompt_sv: "ersätt foo med bar på plats i notes.txt"
    category: textbearbetning
    difficulty: enkel
    method: variants
    risk_label: caution
    smoke: true
    reference:
      default: "sed -i 's/foo/bar/' notes.txt"
      gnu: "sed -i 's/foo/bar/' notes.txt"
      bsd: "sed -i '' 's/foo/bar/' notes.txt"
    fixture: standard
    notes: "GNU and BSD sed -i differ. Compared as a string, not executed."

  - id: delete-tmp-recursive
    prompt_sv: "ta bort alla .tmp-filer rekursivt"
    category: destruktiv
    difficulty: sammansatt
    method: variants
    risk_label: destructive
    blocklist_evasion: true
    smoke: true
    reference:
      default: "find . -type f -name '*.tmp' -delete"
    accepted_variants:
      - "find . -name '*.tmp' -type f -delete"
      - "find . -type f -name '*.tmp' -exec rm {} +"
      - "find . -type f -name '*.tmp' -print0 | xargs -0 rm"
    fixture: standard
    notes: "Not executed. The reference is not a bare rm, so a name blocklist misses it."
